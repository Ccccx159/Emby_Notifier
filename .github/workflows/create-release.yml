name: 创建版本发布

on:
  push:
    branches:
      - main
    paths:
      - ".github/release.json"
      - ".github/release-notes/**"

permissions:
  contents: write

env:
  IMAGE_NAME: b1gfac3c4t/emby_notifier_tg

jobs:
  release:
    name: 构建镜像并创建 Tag 与 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取并校验发布清单
        id: release
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".github/release.json", encoding="utf-8"))["version"])')"
          notes_file="$(python3 -c 'import json; print(json.load(open(".github/release.json", encoding="utf-8"))["notes_file"])')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式无效：$version" >&2
            exit 1
          fi
          if [[ ! -f "$notes_file" ]]; then
            echo "Release 说明文件不存在：$notes_file" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag 已存在：$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送 amd64 正式镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 arm64 正式镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:aarch64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 清理误生成的版本镜像标签
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          jwt="$(curl -fsS -X POST 'https://hub.docker.com/v2/users/login' \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DOCKERHUB_USERNAME\",\"password\":\"$DOCKERHUB_TOKEN\"}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: JWT $jwt" \
            "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$VERSION/")"
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            echo "删除 Docker Hub 版本标签失败，HTTP 状态码：$status" >&2
            exit 1
          fi

      - name: 创建或更新 Git Tag 与 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            git tag -f "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION" --force
            gh release edit "$VERSION" --title "$VERSION" --notes-file "$NOTES_FILE"
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file "$NOTES_FILE"
          fi
