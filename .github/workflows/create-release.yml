name: 创建版本发布

on:
  push:
    branches:
      - main
    paths:
      - ".github/release.json"
      - ".github/release-notes/**"

permissions:
  contents: write

env:
  IMAGE_NAME: b1gfac3c4t/emby_notifier_tg

jobs:
  release:
    name: 构建镜像并创建 Tag 与 Release
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取并校验发布清单
        id: release
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".github/release.json", encoding="utf-8"))["version"])')"
          notes_file="$(python3 -c 'import json; print(json.load(open(".github/release.json", encoding="utf-8"))["notes_file"])')"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "版本号格式无效：$version" >&2
            exit 1
          fi
          if [[ ! -f "$notes_file" ]]; then
            echo "Release 说明文件不存在：$notes_file" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag 已存在：$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: 配置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送正式多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 Git Tag 与 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: >-
          gh release create "$VERSION"
          --target "$GITHUB_SHA"
          --title "$VERSION"
          --notes-file "$NOTES_FILE"
